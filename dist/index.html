<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf5">
    <meta name="description" content="ハルノヒトは、AIやデジタルを使いながら、小さなものづくりを楽しむ、ちいさなデジタル工房です。">
    <title>ハルノヒト｜ちいさなデジタル工房</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fffaf5'/%3E%3Cpath d='M8 24C4 13 12 6 24 7C25 18 20 26 8 24Z' fill='none' stroke='%23d8715f' stroke-width='2.5'/%3E%3Cpath d='m19 8 1 5 5-1' fill='none' stroke='%23d8715f' stroke-width='2.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/ending.css">
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/companions.js" defer></script>
    <script src="./scripts/ending.js" defer></script>
  </head>
  <body>
    <main>
      <section class="first-view" aria-labelledby="brand-name">
        <div class="brand">
          <p class="brand-caption">ちいさなデジタル工房</p>
          <h1 id="brand-name" aria-label="ハルノヒト"><span aria-hidden="true"><span>ハ</span><span>ル</span><span>ノ</span><span>ヒ</span><span>ト</span></span></h1>
        </div>
        <div class="scene">
          <img class="girl" src="./assets/images/girl.png" width="1280" height="720" alt="花の模様の髪を風になびかせ、両手を広げて笑う女の子" fetchpriority="high">
          <div class="petals" aria-hidden="true"></div>
        </div>
        <div class="corner-companions" role="img" aria-label="左下に並ぶ、ゆうちゃんとHaruの小さなキャラクター">
          <span class="companion companion--yuu">
            <img src="./assets/images/companions/yuu-open.png" width="1254" height="1254" alt="" decoding="async" fetchpriority="low">
            <img class="companion-eyes" src="./assets/images/companions/yuu-closed.png" width="1254" height="1254" alt="" decoding="async" fetchpriority="low">
          </span>
          <span class="companion companion--haru">
            <img src="./assets/images/companions/haru-open.png" width="1254" height="1254" alt="" decoding="async" fetchpriority="low">
            <img class="companion-eyes" src="./assets/images/companions/haru-closed.png" width="1254" height="1254" alt="" decoding="async" fetchpriority="low">
          </span>
        </div>
      </section>
      <!-- Future sections belong here, between the completed first view and the ending. -->

      <!-- Ending copy and destinations: edit the text and href values in this section. -->
      <section class="ending" id="ending" aria-labelledby="ending-title">
        <div class="ending-inner">
          <div class="ending-companions" role="img" aria-label="並んでほほえむ、ゆうちゃんとHaru">
            <span class="ending-character ending-character--yuu">
              <img src="./assets/images/companions/yuu-open.png" width="1254" height="1254" alt="" loading="lazy" decoding="async">
              <img class="ending-eyes" src="./assets/images/companions/yuu-closed.png" width="1254" height="1254" alt="" loading="lazy" decoding="async">
            </span>
            <span class="ending-character ending-character--haru">
              <img src="./assets/images/companions/haru-open.png" width="1254" height="1254" alt="" loading="lazy" decoding="async">
              <img class="ending-eyes" src="./assets/images/companions/haru-closed.png" width="1254" height="1254" alt="" loading="lazy" decoding="async">
            </span>
          </div>
          <h2 class="ending-title" id="ending-title"><span>ここまで遊びにきてくれて、</span><span>ありがとう。</span></h2>
          <p class="ending-message">この小さな工房を、少しずつ育てています。</p>

          <div class="ending-paths">
            <div class="ending-path">
              <h3 class="ending-path-title">お問い合わせ</h3>
              <p class="ending-description">ご相談やメッセージは、こちらから。</p>
              <a class="ending-link" href="https://www.reservestock.jp/inquiry/58391">お問い合わせ<span aria-hidden="true"> →</span></a>
            </div>
            <div class="ending-path">
              <h3 class="ending-path-title">ゆうちゃんのお便り</h3>
              <p class="ending-description"><span>AIのこと、暮らしのことなどを</span><span>お届けしています。</span></p>
              <a class="ending-link" href="https://www.reservestock.jp/subscribe/160983">ゆうちゃんのお便りを受け取る<span aria-hidden="true"> →</span></a>
            </div>
          </div>
          <p class="ending-link-note">お問い合わせ・お便りの登録は、リザストのページへつながります。</p>
        </div>
      </section>
    </main>
    <footer class="ending-footer"><p>ハルノヒト</p></footer>
  </body>
</html>
